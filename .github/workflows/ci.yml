name: Python checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - '**.py'
      - requirements.txt
      - .github/workflows/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
