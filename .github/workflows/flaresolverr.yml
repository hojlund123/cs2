name: Scrape HLTV results

on:
  workflow_dispatch:
  schedule:
    - cron: '4 */6 * * *'

permissions:
  contents: write

concurrency:
  group: hltv-results-writer
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Start FlareSolverr
        run: docker run -d --name flaresolverr -p 127.0.0.1:8191:8191 ghcr.io/flaresolverr/flaresolverr:latest
      - name: Wait for FlareSolverr readiness
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 2 http://localhost:8191/health; then
              exit 0
            fi
            sleep 2
          done
          echo '::error::FlareSolverr did not become ready'
          exit 1
      - name: Collect results
        id: collect
        run: python -m hltv_stats.results
      - name: Save completed progress
        if: ${{ !cancelled() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure') }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results.json scrape_state.json failed_urls.json
          if git diff --cached --quiet; then
            echo 'No data changes to commit'
            exit 0
          fi
          git commit -m 'Update HLTV results'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: FlareSolverr diagnostics
        if: always()
        run: docker logs --tail 200 flaresolverr
